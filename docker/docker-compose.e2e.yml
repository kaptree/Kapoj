services:
  postgres:
    ports: !override
      - "127.0.0.1:15433:5432"
    volumes: !override
      - e2e-pgdata:/var/lib/postgresql/data

  redis:
    ports: !override
      - "127.0.0.1:16380:6379"

  minio:
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes: !override
      - e2e-minio-data:/data

  server:
    env_file: !override
      - ../.env.e2e
    environment:
      KAPOJ_MINIO_BUCKET: kapoj-e2e
      KAPOJ_MINIO_BACKUP_BUCKET: kapoj-e2e-backups
    ports: !override
      - "127.0.0.1:18080:8080"

  judge:
    env_file: !override
      - ../.env.e2e
    environment:
      KAPOJ_MINIO_BUCKET: kapoj-e2e
      KAPOJ_MINIO_BACKUP_BUCKET: kapoj-e2e-backups

  web:
    ports: !override
      - "127.0.0.1:15173:80"

volumes:
  e2e-pgdata:
  e2e-minio-data:
