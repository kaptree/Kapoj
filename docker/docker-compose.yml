name: kapoj

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO archived its official images in 2026. This community mirror is
    # pinned for local/dev; production should point KAPOJ_MINIO_* at an
    # existing MinIO or S3-compatible service.
    image: firstfinger/minio:latest@sha256:fdb29bb0a42939d0cd1f80d8ff2cc17eceac76916bbe52cf98793c5af87cb714
    entrypoint: ["/usr/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    profiles: ["app"]
    build:
      context: ../apps/server
      args:
        GOPROXY: ${KAPOJ_GOPROXY:-https://goproxy.cn,direct}
    # Single config source: the repository-root .env file.
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Docker API 白名单代理：judge 只能通过它访问 Docker，不能直接挂载 socket。
  # 只加入 judge-socket 内部网络，server/web 无法访问；不映射宿主机端口。
  socket-proxy:
    profiles: ["app"]
    image: tecnativa/docker-socket-proxy:lts@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    environment:
      # 仅评测必需的容器生命周期、exec 与只读诊断接口。
      CONTAINERS: "1"
      EXEC: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      PING: "1"
      VERSION: "1"
      INFO: "1"
      # 明确关闭高风险/非必需 API，便于审计（默认也是关闭）。
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      IMAGES: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - judge-socket
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:2375/_ping >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge:
    profiles: ["app"]
    build:
      context: ../apps/judge
      args:
        GOPROXY: ${KAPOJ_GOPROXY:-https://goproxy.cn,direct}
    env_file:
      - ../.env
    environment:
      # 默认经白名单代理访问 Docker；直连回退由 docker-compose.direct.yml 覆盖。
      DOCKER_HOST: tcp://socket-proxy:2375
    networks:
      - default
      - judge-socket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy

volumes:
  pgdata:

networks:
  judge-socket:
    internal: true
