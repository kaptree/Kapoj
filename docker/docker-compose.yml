name: kapoj

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kapoj
      POSTGRES_PASSWORD: kapoj
      POSTGRES_DB: kapoj
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapoj -d kapoj"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["app"]
    build:
      context: ../apps/server
    environment:
      KAPOJ_HTTP_ADDR: ":8080"
      KAPOJ_DATABASE_URL: postgres://kapoj:kapoj@postgres:5432/kapoj?sslmode=disable
      KAPOJ_REDIS_ADDR: redis:6379
      KAPOJ_JWT_SECRET: ${KAPOJ_JWT_SECRET:-}
      KAPOJ_STORAGE_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge:
    profiles: ["app"]
    build:
      context: ../apps/judge
    environment:
      KAPOJ_DATABASE_URL: postgres://kapoj:kapoj@postgres:5432/kapoj?sslmode=disable
      KAPOJ_REDIS_ADDR: redis:6379
      KAPOJ_STORAGE_DIR: /data
      KAPOJ_JUDGE_CONCURRENCY: "2"
      KAPOJ_JUDGE_DOCKER: docker
    volumes:
      - storage:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  storage:
