openapi: 3.0.3
info:
  title: kapOJ API
  version: 0.1.0
  description: |
    kapOJ 后端接口。所有响应都使用统一结构 `{ code, message, data }`，
    `code` 为 0 表示成功，否则为错误码（见 DEVELOPMENT.md 2.4 的错误码表）。
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: 注册并直接登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: 用用户名或邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: 用 refresh token 换取新的令牌（旧 refresh token 立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: 登出，吊销 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /users/me:
    get:
      summary: 当前用户信息
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新当前用户资料（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /users/{id}/profile:
    get:
      summary: 用户公开主页
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 公开资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/rating-history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 用户 Rating 历史（公开）
      description: 按时间倒序返回 kind=contest 的 Rating 变化；用户不存在返回 40400。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Rating 历史分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingHistoryPageResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /leaderboard/rating:
    get:
      summary: Rating 排行榜（公开）
      description: 只包含状态为 active 的用户，按 Rating 倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Rating 排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingLeaderboardPageResponse' }
  /leaderboard/activity:
    get:
      summary: 活跃度排行榜（公开）
      description: 只包含总活跃度 > 0 且状态为 active 的用户，按总分倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 活跃度排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityLeaderboardPageResponse' }
  /leaderboard/sharing:
    get:
      summary: 共享排行榜（公开）
      description: 只包含共享分 > 0 且状态为 active 的用户，按共享分倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 共享排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingLeaderboardPageResponse' }
  /activity/summary:
    get:
      summary: 我的活跃度摘要（登录）
      description: 返回今日是否已签到、今日活跃度与总活跃度；日期边界使用服务器本地时区。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 活跃度摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySummaryResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /activity/signin:
    post:
      summary: 每日签到（登录）
      description: 每个本地自然日首次签到奖励 5 活跃度与 5 金币；重复签到返回 awarded=false，不重复发放奖励。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 签到结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySignInResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      summary: 用户列表（仅超级管理员）
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /contests:
    get:
      summary: 比赛列表（公开；管理员可 includeHidden）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/ContestMode' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContestStatus' } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 仅比赛管理员有效 }
        - { name: mine, in: query, schema: { type: boolean }, description: 仅返回当前登录用户已报名的比赛；游客使用返回 40001 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 比赛分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建比赛（比赛管理员/超级管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /contests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛详情；非公开比赛对非报名者/非管理员返回 40400
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 比赛详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换比赛（比赛管理员）；problems 为完整题目列表
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '200':
          description: 更新后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除比赛（比赛管理员）；级联删除题目关联、报名与公告
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/clone:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 克隆比赛（比赛管理员）；复制配置与题目，不复制报名/公告
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneContestRequest' }
      responses:
        '201':
          description: 克隆后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/register:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 报名比赛（登录用户）；按 open/password/invite 校验
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterContestRequest' }
      responses:
        '200':
          description: 已报名（重复报名幂等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterContestResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/participants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 报名用户列表（比赛管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 报名用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestParticipantListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/ranklist:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛榜单（ICPC/IOI/OI）；OI 赛时非管理员只返回本人行
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 当前榜单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestRanklistResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/announcements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛公告列表；非公开比赛对非报名者/非管理员返回 40400
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 公告列表，按 id 倒序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 发布公告（比赛管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: 已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/announcements/{aid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: aid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 修改公告（比赛管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除公告（比赛管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems:
    get:
      summary: 题目列表（游客可访问，只返回已公开题目）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配标题或题目标识，不区分大小写，按字面量匹配 }
        - { name: tag, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 仅题目管理员有效；需要携带 bearer token }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 题目分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建题目（题目管理员）；新题目一律为未公开
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 题目详情；未公开题目对非管理员返回 40400
      responses:
        '200':
          description: 题目详情；题解字段对管理员或本人已通过该题的用户可见
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换题目（题目管理员）；必须提交全部可编辑字段
      description: >-
        PUT 是整体替换：未提交的字段会变成零值（字符串清空、数组清空、isPublic=false），
        不会保留原值。发布需至少 1 个测试点，特判题还需 checker。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemUpdateInput' }
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除题目；已有提交记录时只下线
      security: [{ bearer: [] }]
      responses:
        '200':
          description: offlined 为 true 表示仅下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteProblemResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/statistics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 提交统计
      responses:
        '200':
          description: 提交与通过统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测试点列表（题目管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 按顺序排列的测试点元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 上传测试点（题目管理员）；输入输出文件各不超过 16 MiB，请求体不超过 40 MiB
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, output]
              properties:
                input: { type: string, format: binary }
                output: { type: string, format: binary }
                score: { type: integer, minimum: 0, maximum: 1000, default: 10 }
                isSample: { type: boolean, default: false }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases/{tid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: tid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 修改测试点分数或样例标记（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestcaseRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
