    AIProviderOption:
      type: object
      required: [code, name, defaultModel]
      properties:
        code: { type: string, description: provider code，如 deepseek/openai/qwen/glm }
        name: { type: string }
        defaultModel: { type: string }
    AIConfigView:
      type: object
      description: 用户 AI 配置脱敏视图；apiKeyMasked 绝不包含明文或密文 API key。
      required: [configured, provider, modelName, apiKeyMasked, providers]
      properties:
        configured: { type: boolean, description: 是否已配置；false 时 provider/modelName/apiKeyMasked 均为空字符串 }
        provider: { type: string, description: provider code；未配置时为空字符串 }
        modelName: { type: string, description: 模型名；未配置时为空字符串 }
        apiKeyMasked: { type: string, description: 脱敏后的 API key；未配置时为空字符串 }
        providers:
          type: array
          description: 启用的 provider 列表
          items: { $ref: '#/components/schemas/AIProviderOption' }
    AISaveConfigInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: provider code，必须为启用状态 }
        apiKey: { type: string, description: 首次保存必填；已有配置且留空时保留原密钥 }
        modelName: { type: string, description: 为空时使用 provider 默认模型 }
    AICompleteInput:
      type: object
      description: 代码自动补全请求体；cursor 必填（字节偏移）。
      required: [code, language, cursor]
      properties:
        code: { type: string, maxLength: 65536, description: 按 UTF-8 字节数不超过 64 KiB }
        language: { type: string, minLength: 1, maxLength: 32 }
        cursor: { type: integer, minimum: 0, description: 光标位置（字节偏移，0..len(code)） }
    AICompleteOutput:
      type: object
      required: [completion]
      properties:
        completion: { type: string, description: 补全片段（不含外层 Markdown 代码围栏） }
    AIFormatInput:
      type: object
      description: 代码格式化请求体；cursor 可选（会被忽略）。
      required: [code, language]
      properties:
        code: { type: string, maxLength: 65536, description: 按 UTF-8 字节数不超过 64 KiB }
        language: { type: string, minLength: 1, maxLength: 32 }
        cursor: { type: integer, minimum: 0 }
    AIFormatOutput:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 格式化后的完整代码 }
    AIOptimizeInput:
      type: object
      description: 代码优化请求体；cursor 可选（会被忽略）。
      required: [code, language]
      properties:
        code: { type: string, maxLength: 65536, description: 按 UTF-8 字节数不超过 64 KiB }
        language: { type: string, minLength: 1, maxLength: 32 }
        cursor: { type: integer, minimum: 0 }
    AIOptimizeOutput:
      type: object
      required: [suggestions, code]
      properties:
        suggestions: { type: string, description: 优化建议 }
        code: { type: string, description: 优化后的代码 }
    AIHintInput:
      type: object
      required: [problemId]
      properties:
        problemId: { type: integer, format: int64, minimum: 1 }
    AIHintOutput:
      type: object
      required: [hint, cached]
      properties:
        hint: { type: string, description: 中文提示文本 }
        cached: { type: boolean, description: 是否命中已缓存的提示 }
    AIConfigViewResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AIConfigView' }
    AICompleteResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AICompleteOutput' }
    AIFormatResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AIFormatOutput' }
    AIOptimizeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AIOptimizeOutput' }
    AIHintResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AIHintOutput' }
    SolutionAccess:
      type: string
      description: 官方题解访问状态；locked/guest 不返回正文。
      enum: [free, accepted, purchased, creator, locked, guest]
    OfficialSolutionInput:
      type: object
      description: 官方题解的唯一写入口；不修改题面/测试数据。
      required: [solutionMd, solutionCode, priceCoins]
      properties:
        solutionMd: { type: string, maxLength: 50000, description: 官方说明（Markdown），不超过 50000 字符 }
        solutionCode: { type: string, description: 官方代码，不超过 65536 字节 }
        priceCoins: { type: integer, format: int64, minimum: 0, maximum: 1000000, description: 解锁价格（金币），0 表示所有人免费 }
    OfficialSolutionView:
      type: object
      description: 官方题解访问视图；solutionMd/solutionCode 仅在允许的访问状态（creator/accepted/purchased/free）下返回。
      required: [priceCoins, access, canEdit, canPurchase]
      properties:
        priceCoins: { type: integer, format: int64, description: 解锁价格（金币），0 表示免费 }
        access: { $ref: '#/components/schemas/SolutionAccess' }
        canEdit: { type: boolean, description: 是否为题目创建者或 super，可编辑官方题解 }
        canPurchase: { type: boolean, description: 登录且价格 > 0、未通过/未解锁时是否可购买 }
        solutionMd: { type: string, description: 官方说明；locked/guest 时不返回 }
        solutionCode: { type: string, description: 官方代码；locked/guest 时不返回 }
    SolutionAuthor:
      type: object
      description: 帖子/回复作者的公开摘要；仅含 id/username/nickname，不含邮箱。
      required: [id, username, nickname]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
    SolutionPostInput:
      type: object
      description: 发布/编辑帖子的输入；标题 1–100 字符、正文 1–50000 字符。
      required: [title, contentMd]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        contentMd: { type: string, minLength: 1, maxLength: 50000 }
    SolutionReplyInput:
      type: object
      description: 发布/编辑回复的输入；正文 1–10000 字符。
      required: [contentMd]
      properties:
        contentMd: { type: string, minLength: 1, maxLength: 10000 }
    SolutionPostItem:
      type: object
      description: 帖子列表项；正文不返回，只返回摘要（前 200 字符）。
      required: [id, problemId, userId, title, excerpt, author, replyCount, createdAt, updatedAt, canEdit, canDelete]
      properties:
        id: { type: integer, format: int64 }
        problemId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        excerpt: { type: string, description: 正文摘要（按 rune 截取前 200 字符） }
        author: { $ref: '#/components/schemas/SolutionAuthor' }
        replyCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        canEdit: { type: boolean, description: 当前用户是否为作者 }
        canDelete: { type: boolean, description: 作者、题目创建者或拥有 problem.update 的管理员可删除 }
    SolutionPostDetail:
      allOf:
        - $ref: '#/components/schemas/SolutionPostItem'
        - type: object
          required: [contentMd, replies]
          properties:
            contentMd: { type: string, description: 帖子正文（Markdown） }
            replies: { type: array, items: { $ref: '#/components/schemas/SolutionReplyItem' } }
    SolutionReplyItem:
      type: object
      description: 帖子回复；回复按 created_at ASC, id ASC 排序。
      required: [id, postId, userId, contentMd, author, createdAt, updatedAt, canEdit, canDelete]
      properties:
        id: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        contentMd: { type: string }
        author: { $ref: '#/components/schemas/SolutionAuthor' }
        createdAt: { type: string, format: date-time }
