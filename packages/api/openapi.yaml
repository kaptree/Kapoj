              schema: { $ref: '#/components/schemas/ProblemPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建题目（problem.create）；新题目一律为未公开
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 题目详情；未公开题目对无 problem.view_hidden 者返回 40400
      responses:
        '200':
          description: 题目详情；题解字段对拥有题目管理权限（problem.update/delete/publish/testcase.manage/checker.manage）或本人已通过该题的用户可见
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换题目（problem.update；修改 isPublic 另需 problem.publish）；必须提交全部可编辑字段
      description: >-
        PUT 是整体替换：未提交的字段会变成零值（字符串清空、数组清空、isPublic=false），
        不会保留原值。发布需至少 1 个测试点，特判题还需 checker。
        修改 isPublic（公开/下线）需要 problem.update + problem.publish，仅 problem.update 不能发布或下线。
        题目被任一活跃学习路线引用时，将 isPublic 从 true 改为 false（下线）返回 40001
        「题目被学习路线引用，不能下线/删除」；需先移除引用节点后才能下线。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemUpdateInput' }
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除题目（problem.delete）；已有提交记录时只下线
      description: >-
        被任一活跃学习路线引用时返回 40001「题目被学习路线引用，不能下线/删除」，
        需先移除引用节点后才能删除。无提交记录时物理删除，有提交记录时仅下线。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: offlined 为 true 表示仅下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteProblemResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
