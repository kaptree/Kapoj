      summary: 上传特判 checker（problem.checker.manage；C++ 源码，不超过 256 KiB，仅特判题）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /submissions:
    get:
      summary: 测评记录列表（游客可访问）；隐藏题的提交需要 problem.view_hidden 才能看到他人记录
      security: [{}, { bearer: [] }]
      parameters:
        - { name: problemId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: contestId, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: 0 表示练习提交 }
        - { name: userId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: language, in: query, schema: { $ref: '#/components/schemas/SubmissionLanguage' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubmissionStatus' } }
        - { name: nickname, in: query, schema: { type: string, maxLength: 64 }, description: 昵称模糊匹配 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 测评记录分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 提交代码（登录用户）；创建后进入 pending 并由评测服务异步处理
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubmissionRequest' }
      responses:
        '201':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionCreatedResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /submissions/stream:
    get:
      summary: 测评记录实时事件（SSE）；事件数据只含 submissionId
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 'text/event-stream；每行 data 为 {"submissionId": <id>}'
          content:
            text/event-stream:
              schema: { type: string }
        '503': { $ref: '#/components/responses/Error' }
  /submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测评记录详情；隐藏题的他人提交需 problem.view_hidden，比赛进行中的他人提交需 submission.view_live_contest
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 测评记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /achievements:
    get:
      summary: 成就列表；游客可访问，登录用户含解锁状态与条件进度
      description: |
        游客只看到上架成就；登录用户读取时会先补算解锁与奖励，并额外看到自己已解锁但已下线的成就。
        includeInactive=true 需要 gamification.achievement.manage 权限，否则返回 40300。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 需要 gamification.achievement.manage 权限；true 时包含已下线成就 }
      responses:
        '200':
          description: 成就列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建成就（gamification.achievement.manage）
      description: code 必须唯一且符合格式；条件配置非法或奖励金币为负时返回 40001。rewardBadgeId 非空时徽章必须存在且上架，否则返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /achievements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新成就（gamification.achievement.manage；整体替换，code 创建后不可修改）
      description: code 留空表示保持原值；尝试修改 code 或条件配置非法时返回 40001。rewardBadgeId 为 null 时保持原奖励徽章不变，非空时徽章必须存在且上架。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementInput' }
      responses:
        '200':
          description: 更新后的成就；不含当前用户的解锁信息与进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除成就（gamification.achievement.manage；保留已解锁记录与金币流水）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/me/achievements:
    get:
      summary: 我的成就（登录；含已解锁与未解锁）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户的成就列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      summary: 任务大厅；游客可访问，登录用户含领取状态与进度
      description: |
        游客只看到上架且未结束的任务；登录用户读取时会先补算完成与奖励，
        并额外看到自己领取过的任务（包括已下线、已结束与已完成）。
        includeInactive=true 需要 gamification.task.manage 权限，否则返回 40300。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 需要 gamification.task.manage 权限；true 时包含已下线与已结束的任务 }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建任务（gamification.task.manage）
      description: 题目必须为 1–20 个不重复的公开题目；时间非法、奖励为负或超过 1000000 时返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新任务（gamification.task.manage；整体替换）
      description: 已有领取记录后 problemIds 与 rewardCoins 被冻结，修改返回 40001；标题、描述、时间与上下架仍可修改。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: 更新后的任务；不含当前用户的领取信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除任务（gamification.task.manage；已领取用户仍可在截止前完成）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tasks/{id}/claim:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 领取任务（登录）
      description: |
        任务必须上架且满足 start <= now < end；在领取窗口内重复领取返回当前记录（幂等）。
        任务未开始、已截止、已下线或已完成返回 40001；任务不存在返回 40400。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 领取后的任务；status 为 claimed，completed 时不能再次领取
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /coins/transactions:
    get:
      summary: 我的金币流水（登录；分页，含当前余额）
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 金币流水；按 created_at 倒序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoinTransactionPageResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/coins:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 管理员调整金币（user.coins.adjust；正负均可，附备注，写入审计）
      description: amount 不能为 0，note 为 1–200 字符；调整后余额不能为负。参数非法或余额不足返回 40001，用户不存在返回 40400。调整与审计在同一事务内完成，审计失败则回滚。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCoinAdjustInput' }
      responses:
        '200':
          description: 调整成功，返回调整后的余额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoinAdjustResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /gamification/config:
    get:
      summary: 游戏化公开配置
      description: 返回服务端生效的徽章装备上限，供商城与装扮管理展示 n/上限并提前禁用装备按钮。游客可访问。
      responses:
        '200':
          description: 公开配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GamificationConfigResponse' }
  /badges:
    get:
      summary: 徽章商城（游客可访问；登录用户含拥有与装备状态）
      description: |
        游客只看到上架徽章；登录用户额外看到自己已拥有的下线徽章，并可继续装备或卸下。
        includeInactive=true 需要 gamification.badge.manage 权限，否则返回 40300。列表按 sort_order、id 排序。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 需要 gamification.badge.manage 权限；true 时包含全部已下线徽章 }
      responses:
        '200':
          description: 徽章列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建徽章（gamification.badge.manage）
      description: 名称 1–100 字、分类 1–20 字；价格 0–1000000；限量库存不能为负。imageUrl 必须为 http(s) 外链或 /api/badges/<id>/image。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BadgeInput' }
      responses:
        '201':
          description: 创建成功；不含当前用户的拥有状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /badges/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新徽章（gamification.badge.manage；stock、imageUrl、isActive 可省略保留）
      description: |
        name、category 必填；description、priceCoins、isLimited、sortOrder 按提交值更新
        （省略时会写为空字符串、0 或 false，并不会保留旧值）。
        isActive 缺省时保持原值；stock 缺省时保持当前库存（不会把并发购买已扣减的库存恢复）；
        imageUrl 为空字符串时保持现有图片（上传接口单独写入）。删除为软下线，已购买用户仍保留并展示。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BadgeInput' }
      responses:
        '200':
          description: 更新后的徽章；不含当前用户的拥有状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除徽章（gamification.badge.manage；保留已购买记录与公开展示）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /badges/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 上传徽章图片（gamification.badge.manage；multipart）
      description: |
        file 字段支持 PNG、JPEG、WebP、GIF，且不超过 2 MiB；保存为 badges/<id>，
        并把 image_url 写为 /api/badges/<id>/image。缺少文件、格式或大小非法返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      summary: 读取徽章图片（公开）
      description: 只返回上传到本地存储的图片；外链、文件缺失或格式非法返回 40400。响应带 Cache-Control public, max-age=3600。
      responses:
        '200':
          description: 原始图片，最大 2 MiB
          headers:
            Cache-Control:
              schema: { type: string }
              description: public, max-age=3600
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  /badges/{id}/purchase:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 购买徽章（登录）
      description: 在同一事务内校验上架、未拥有、限量库存与金币余额并扣减；已拥有、库存不足、余额不足或已下线返回 40001。成就奖励发放不占用商城库存。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 购买成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /badges/{id}/equip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 装备徽章（登录）
      description: 仅能装备已拥有的徽章；已装备时幂等成功。装备上限由 KAPOJ_MAX_EQUIPPED_BADGES 配置（1–10，默认 3），超过上限返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已装备或原本已装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /badges/{id}/unequip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 卸下徽章（登录）
      description: 未装备时幂等成功；未拥有该徽章返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已卸下或原本未装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/badges:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 用户拥有的徽章及装备状态（公开）
      description: 返回该用户拥有的全部徽章（包括已下线）与装备状态，按 sort_order、id 排序；用户不存在返回 40400。
      responses:
        '200':
          description: 用户徽章列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeListResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /titles:
    get:
      summary: 称号商店（游客可访问；登录用户含解锁、购买、装备状态与条件进度）
      description: |
        登录用户读取时先补算解锁（不扣金币）。已解锁但已下线的称号仍可见，未解锁且已下线的只对拥有 gamification.title.manage 者可见。
        includeInactive=true 需要 gamification.title.manage 权限，否则返回 40300。列表按 sort_order、id 排序。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 需要 gamification.title.manage 权限；true 时包含全部已下线称号 }
      responses:
        '200':
          description: 称号列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建称号（gamification.title.manage）
      description: '名称 1–100 字；颜色必须为 #RRGGBB；价格 0–1000000；解锁条件必须为正整数阈值、Rating 或符合成就 code 格式的字符串。'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '201':
          description: 创建成功；不含当前用户的解锁、购买与装备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /titles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新称号（gamification.title.manage；整体替换）
      description: isActive 缺省时保持原值。删除为软下线，已解锁/已购买记录保留。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '200':
          description: 更新后的称号；不含当前用户的解锁、购买与装备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除称号（gamification.title.manage；保留已解锁与已购买记录）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/purchase:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 购买称号（登录）
      description: 必须已解锁且未购买，并在同一事务内扣除金币、写流水、记录购买时间；未解锁、已购买或余额不足返回 40001。已下线但已解锁的称号仍可购买。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 购买成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/equip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 装备称号（登录）
      description: 必须已购买；同一事务内先卸下该用户全部称号再装备目标称号，重复装备幂等成功。未购买返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已装备或原本已装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/unequip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 卸下称号（登录）
      description: 未装备时幂等成功；从未解锁该称号或称号不存在返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已卸下或原本未装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths:
    get:
      summary: 学习路线列表（游客可访问，可选登录）
      description: >-
        返回当前查看者可见的活跃路线：官方路线、公开自定义路线，以及自己创建的私有路线。
        私有路线仅作者与拥有 learning_path.admin.read 或 learning_path.official.manage 者可见；`mine=true` 只返回自己创建的路线。
        `includeInactive=true` 需要 learning_path.admin.read 或 learning_path.official.manage，用于查看已下架（软删除）路线；普通用户传入会被忽略。
        排序为官方优先，其次 `sortOrder`、`id`。登录用户读取前服务端会重算该用户可见路线的进度并写回，`myCompletedCount` 为最新完成节点数；游客为 0。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: mine, in: query, schema: { type: boolean, default: false }, description: 仅返回当前登录用户创建的路线；游客返回空列表 }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 包含已下架路线；需要 learning_path.admin.read 或 learning_path.official.manage }
      responses:
        '200':
          description: 学习路线列表（不分页）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathListResponse' }
    post:
      summary: 创建学习路线（登录；官方路线需 learning_path.official.manage）
      description: >-
        普通用户创建自定义路线，默认私有（`isPublic=false`）、活跃，且不能设置官方标记；
        提交 `isOfficial=true` 返回 40300，非管理员提交的 `isActive` 会被忽略（始终为活跃）。
        拥有 learning_path.official.manage 者可以创建官方路线并设置 `isOfficial`/`isPublic`/`isActive`；
        官方路线强制公开（`isPublic=true`）。标题 1–100 字，描述不超过 50000 字，
        封面地址必须为 http/https 且不超过 512 字节。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningPathInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 学习路线详情（游客可访问，可选登录）
      description: >-
        活跃官方/公开路线所有人可见；活跃私有路线仅作者与拥有 learning_path.admin.read 或
        learning_path.official.manage 者可见；已下架路线需要 learning_path.admin.read 或
        learning_path.official.manage。无权限或不存在均返回 40400。详情接口不重算进度，`myCompletedCount` 反映服务端已存储进度；实时值以列表/树接口为准。
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 学习路线元信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新学习路线（作者/learning_path.official.manage）
      description: >-
        只有作者或拥有 learning_path.official.manage 者可以编辑；官方路线仅拥有
        learning_path.official.manage 者可编辑，已下架路线仅拥有 learning_path.official.manage
        者可编辑/恢复（learning_path.admin.read 只读，不参与写授权）。
        标题、描述、封面与 `sortOrder` 为整体替换（未提交的 `sortOrder` 变为 0）；
        `isPublic`/`isActive` 未提交时保持原值。`isOfficial` 仅可在创建时由拥有 learning_path.official.manage 者设置，创建后不可修改：
        拥有 learning_path.official.manage 者提交不同值返回 40001（不能把自定义路线提升为官方或取消官方标记），非管理员提交不同值返回 40300。
        官方路线强制公开。公开自定义路线或恢复上架前会校验节点引用的题目仍存在且公开，否则返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningPathInput' }
      responses:
        '200':
          description: 更新后的学习路线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 下架学习路线（作者/learning_path.official.manage）
      description: >-
        软删除（`isActive=false`），不删除节点、题目引用或用户进度。作者可下架自己的自定义路线，
        官方路线仅拥有 learning_path.official.manage 者可下架；已下架路线再次删除仅拥有
        learning_path.official.manage 者可操作。作者删除后路线从其常规列表消失，
        只有拥有 learning_path.admin.read 或 learning_path.official.manage 者可通过
        `includeInactive=true` 查看并恢复。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathDeleteResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/tree:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 学习路线树（游客可访问，可选登录）
      description: >-
        返回路线元信息、节点层级、节点题目摘要与当前用户进度。可见性与路线详情一致：
        私有路线仅作者或拥有 learning_path.admin.read / learning_path.official.manage 者可见，
        已下架路线需要 learning_path.admin.read 或 learning_path.official.manage，否则返回 40400。
        节点只返回公开题目的 `problemId/title/slug/difficulty`，不返回题解。
        公开树对非作者且无学习路线管理/只读权限者仅返回公开题目 id；作者、拥有
        learning_path.admin.read 或 learning_path.official.manage 者保留完整存储列表
        （含已下线/缺失题目）用于编辑。登录用户读取前服务端重算并写回进度：
        `solvedCount` 为该节点题目中去重 AC 的题数，`solvedCount >= requiredCount` 时 `status` 为
        `completed`；根节点默认 `active`，子节点仅在父节点 `completed` 后为 `active`、否则 `locked`。
        已完成节点锁存：之后修改节点题目或提高 `requiredCount` 不回退已完成用户（`solvedCount` 保留
        完成时的值），未完成/进行中节点按新配置重算。游客不写进度：根节点 `active`、其余 `locked`、`solvedCount=0`。
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 学习路线树
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningTreeResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/nodes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 创建学习路线节点（作者/learning_path.official.manage）
      description: >-
        只有路线作者或拥有 learning_path.official.manage 者可以写入；官方路线与已下架路线
        仅拥有 learning_path.official.manage 者可以写入（learning_path.admin.read 只读，不参与写授权）。
        校验：标题 1–100 字、描述不超过 50000 字；`problemIds` 为 1–50 道不重复且存在、公开的题目；
        `requiredCount` 为 1–题目数，未提交时默认等于题目数；`parentId` 必须属于同一路线，
        不能是自身或形成环，节点树最大深度 8 层；`parentId` 未提交时为根节点。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningNodeInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningNodeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/nodes/{nodeId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: nodeId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新学习路线节点（作者/learning_path.official.manage）
      description: >-
        整体替换节点可编辑字段。权限与校验同创建节点；移动节点时同时校验父节点属于同一路线、
        不能是自身或形成环，且移动后的子树深度仍不超过 8 层。`requiredCount` 未提交时按本次
        `problemIds` 数量重置，而非保留原值。`nodeId` 必须属于该路线，否则返回 40400。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningNodeInput' }
      responses:
        '200':
          description: 更新后的节点（不含子节点）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningNodeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除学习路线节点（作者/learning_path.official.manage）
      description: >-
        仅允许删除叶子节点；存在子节点时返回 40001。删除节点会级联删除该节点的用户进度。
        官方路线与已下架路线仅拥有 learning_path.official.manage 者可以删除。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathDeleteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /ai/configs:
    get:
      summary: 查询当前用户 AI 配置（登录）
      description: >-
        返回脱敏后的用户 AI 配置与启用的 provider 列表；未配置时 configured=false。
        apiKeyMasked 只返回脱敏值，绝不包含明文或密文。所有 AI 接口仅登录用户可用。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: AI 配置视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConfigViewResponse' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: 保存用户 AI 配置（登录）
      description: >-
        provider 必须为启用的 provider code；首次保存必须提供 apiKey；modelName 为空时使用 provider 默认模型；
        已有配置且 apiKey 留空时保留原密钥。保存成功返回脱敏视图。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AISaveConfigInput' }
      responses:
        '200':
          description: 保存后的 AI 配置视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConfigViewResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /ai/complete:
    post:
      summary: 代码自动补全（登录，限流）
      description: >-
        在光标处补全代码片段；要求已配置 AI provider/key。调用按用户限流（KAPOJ_AI_COOLDOWN），
        无配置或参数非法返回 40001，限流返回 42903，上游 AI 服务失败返回 50200，Redis 不可用返回 50300。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AICompleteInput' }
      responses:
        '200':
          description: 补全片段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AICompleteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ai/format:
    post:
      summary: 代码格式化（登录，限流）
      description: >-
        返回格式化后的完整代码；要求已配置 AI provider/key。其余语义与 /ai/complete 一致：
        参数非法 40001、限流 42903、上游失败 50200、Redis 不可用 50300。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIFormatInput' }
      responses:
        '200':
          description: 格式化后的代码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIFormatResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ai/optimize:
    post:
      summary: 代码优化（登录，限流）
      description: >-
        返回优化建议与优化后代码；要求已配置 AI provider/key。模型返回无法解析为 JSON 时，
        原文作为建议、原代码作为代码返回（不丢失用户代码）。其余语义与 /ai/complete 一致。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIOptimizeInput' }
      responses:
        '200':
          description: 优化建议与代码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIOptimizeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ai/hint:
    post:
      summary: 获取题目 AI 提示（登录，缓存）
      description: >-
        首个用户触发后生成并缓存，后续用户直接读取缓存；缓存命中不要求用户 AI 配置、也不消耗限流。
        非公开题目仅拥有 problem.view_hidden 或 super 可请求，否则与不存在一致返回 40400，不泄露存在性。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIHintInput' }
      responses:
        '200':
          description: AI 提示；cached 表示是否命中缓存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIHintResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AnnouncementInput:
      type: object
      required: [title, contentMd]
      properties:
        title: { type: string, maxLength: 100 }
        contentMd: { type: string, maxLength: 50000 }
    AnnouncementItem:
      type: object
      required: [id, contestId, title, contentMd, createdAt]
      properties:
        id: { type: integer, format: int64 }
        contestId: { type: integer, format: int64 }
        title: { type: string }
        contentMd: { type: string }
        createdAt: { type: string, format: date-time }
    ContestRankProblem:
