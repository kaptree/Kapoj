openapi: 3.0.3
info:
  title: kapOJ API
  version: 0.1.0
  description: |
    kapOJ 后端接口。所有响应都使用统一结构 `{ code, message, data }`，
    `code` 为 0 表示成功，否则为错误码（见 DEVELOPMENT.md 2.4 的错误码表）。
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: 注册并直接登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: 用用户名或邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: 用 refresh token 换取新的令牌（旧 refresh token 立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: 登出，吊销 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /users/me:
    get:
      summary: 当前用户信息
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新当前用户资料（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /users/{id}/profile:
    get:
      summary: 用户公开主页
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 公开资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      summary: 用户列表（仅超级管理员）
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /contests:
    get:
      summary: 比赛列表（公开；管理员可 includeHidden）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/ContestMode' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContestStatus' } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 仅比赛管理员有效 }
        - { name: mine, in: query, schema: { type: boolean }, description: 仅返回当前登录用户已报名的比赛；游客使用返回 40001 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 比赛分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建比赛（比赛管理员/超级管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /contests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛详情；非公开比赛对非报名者/非管理员返回 40400
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 比赛详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换比赛（比赛管理员）；problems 为完整题目列表
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '200':
          description: 更新后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除比赛（比赛管理员）；级联删除题目关联、报名与公告
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/clone:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 克隆比赛（比赛管理员）；复制配置与题目，不复制报名/公告
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneContestRequest' }
      responses:
        '201':
          description: 克隆后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/register:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 报名比赛（登录用户）；按 open/password/invite 校验
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterContestRequest' }
      responses:
        '200':
          description: 已报名（重复报名幂等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterContestResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/participants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 报名用户列表（比赛管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 报名用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestParticipantListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/ranklist:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛榜单（ICPC/IOI/OI）；OI 赛时非管理员只返回本人行
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 当前榜单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestRanklistResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/announcements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛公告列表；非公开比赛对非报名者/非管理员返回 40400
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 公告列表，按 id 倒序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 发布公告（比赛管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: 已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/announcements/{aid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: aid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 修改公告（比赛管理员）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除公告（比赛管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems:
    get:
      summary: 题目列表（游客可访问，只返回已公开题目）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配标题或题目标识，不区分大小写，按字面量匹配 }
        - { name: tag, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 仅题目管理员有效；需要携带 bearer token }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 题目分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建题目（题目管理员）；新题目一律为未公开
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 题目详情；未公开题目对非管理员返回 40400
      responses:
        '200':
          description: 题目详情；题解字段对管理员或本人已通过该题的用户可见
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换题目（题目管理员）；必须提交全部可编辑字段
      description: >-
        PUT 是整体替换：未提交的字段会变成零值（字符串清空、数组清空、isPublic=false），
        不会保留原值。发布需至少 1 个测试点，特判题还需 checker。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemUpdateInput' }
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除题目；已有提交记录时只下线
      security: [{ bearer: [] }]
      responses:
        '200':
          description: offlined 为 true 表示仅下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteProblemResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/statistics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 提交统计
      responses:
        '200':
          description: 提交与通过统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测试点列表（题目管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 按顺序排列的测试点元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 上传测试点（题目管理员）；输入输出文件各不超过 16 MiB，请求体不超过 40 MiB
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, output]
              properties:
                input: { type: string, format: binary }
                output: { type: string, format: binary }
                score: { type: integer, minimum: 0, maximum: 1000, default: 10 }
                isSample: { type: boolean, default: false }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases/{tid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: tid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 修改测试点分数或样例标记（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestcaseRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除测试点；公开题目不能删除最后一个测试点
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases/reorder:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 调整测试点顺序；ids 必须恰好是该题全部测试点
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRequest' }
      responses:
        '200':
          description: 已调整
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/checker:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 上传特判 checker（C++ 源码，不超过 256 KiB，仅特判题）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /submissions:
    get:
      summary: 测评记录列表（游客可访问）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: problemId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: contestId, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: 0 表示练习提交 }
        - { name: userId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: language, in: query, schema: { $ref: '#/components/schemas/SubmissionLanguage' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubmissionStatus' } }
        - { name: nickname, in: query, schema: { type: string, maxLength: 64 }, description: 昵称模糊匹配 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 测评记录分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 提交代码（登录用户）；创建后进入 pending 并由评测服务异步处理
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubmissionRequest' }
      responses:
        '201':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionCreatedResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /submissions/stream:
    get:
      summary: 测评记录实时事件（SSE）；事件数据只含 submissionId
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 'text/event-stream；每行 data 为 {"submissionId": <id>}'
          content:
            text/event-stream:
              schema: { type: string }
        '503': { $ref: '#/components/responses/Error' }
  /submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测评记录详情；比赛提交对他人的代码与测评详情暂不可见
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 测评记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /achievements:
    get:
      summary: 成就列表；游客可访问，登录用户含解锁状态与条件进度
      description: |
        游客只看到上架成就；登录用户读取时会先补算解锁与奖励，并额外看到自己已解锁但已下线的成就。
        includeInactive=true 仅 super_admin 可用，否则返回 40300。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 仅 super_admin 可用；true 时包含已下线成就 }
      responses:
        '200':
          description: 成就列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建成就（仅超级管理员）
      description: code 必须唯一且符合格式；条件配置非法、奖励金币为负或填写 rewardBadgeId 时返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /achievements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新成就（仅超级管理员；整体替换，code 创建后不可修改）
      description: code 留空表示保持原值；尝试修改 code、条件配置非法或填写 rewardBadgeId 时返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementInput' }
      responses:
        '200':
          description: 更新后的成就；不含当前用户的解锁信息与进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除成就（仅超级管理员；保留已解锁记录与金币流水）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/me/achievements:
    get:
      summary: 我的成就（登录；含已解锁与未解锁）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户的成就列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementListResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      summary: 任务大厅；游客可访问，登录用户含领取状态与进度
      description: |
        游客只看到上架且未结束的任务；登录用户读取时会先补算完成与奖励，
        并额外看到自己领取过的任务（包括已下线、已结束与已完成）。
        includeInactive=true 仅 super_admin 可用，否则返回 40300。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 仅 super_admin 可用；true 时包含已下线与已结束的任务 }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建任务（仅超级管理员）
      description: 题目必须为 1–20 个不重复的公开题目；时间非法、奖励为负或超过 1000000 时返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新任务（仅超级管理员；整体替换）
      description: 已有领取记录后 problemIds 与 rewardCoins 被冻结，修改返回 40001；标题、描述、时间与上下架仍可修改。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: 更新后的任务；不含当前用户的领取信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除任务（仅超级管理员；已领取用户仍可在截止前完成）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tasks/{id}/claim:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 领取任务（登录）
      description: |
        任务必须上架且满足 start <= now < end；在领取窗口内重复领取返回当前记录（幂等）。
        任务未开始、已截止、已下线或已完成返回 40001；任务不存在返回 40400。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 领取后的任务；status 为 claimed，completed 时不能再次领取
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /coins/transactions:
    get:
      summary: 我的金币流水（登录；分页，含当前余额）
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 金币流水；按 created_at 倒序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoinTransactionPageResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/coins:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 管理员调整金币（仅超级管理员；正负均可，附备注）
      description: amount 不能为 0，note 为 1–200 字符；调整后余额不能为负。参数非法或余额不足返回 40001，用户不存在返回 40400。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCoinAdjustInput' }
      responses:
        '200':
          description: 调整成功，返回调整后的余额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoinAdjustResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AnnouncementInput:
      type: object
      required: [title, contentMd]
      properties:
        title: { type: string, maxLength: 100 }
        contentMd: { type: string, maxLength: 50000 }
    AnnouncementItem:
      type: object
      required: [id, contestId, title, contentMd, createdAt]
      properties:
        id: { type: integer, format: int64 }
        contestId: { type: integer, format: int64 }
        title: { type: string }
        contentMd: { type: string }
        createdAt: { type: string, format: date-time }
    ContestRankProblem:
      type: object
      required: [problemId, displayId, title]
      properties:
        problemId: { type: integer, format: int64 }
        displayId: { type: string }
        title: { type: string }
    ContestRankCell:
      type: object
      required: [attempts, score]
      properties:
        status: { type: string, description: 该题最近一次未通过状态；有 AC 时为 accepted }
        attempts: { type: integer }
        acceptedAt: { type: string, format: date-time }
        score: { type: integer }
    ContestRankRow:
      type: object
      required: [rank, userId, username, nickname, solved, penalty, totalScore, problems]
      properties:
        rank: { type: integer }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        solved: { type: integer }
        penalty: { type: integer, description: ICPC 罚时（分钟） }
        totalScore: { type: integer, description: IOI/OI 总分 }
        lastAcceptedAt: { type: string, format: date-time }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ContestRankCell' }
    ContestRanklist:
      type: object
      required: [contestId, mode, status, generatedAt, problems, rows, selfOnly]
      properties:
        contestId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/ContestMode' }
        status: { $ref: '#/components/schemas/ContestStatus' }
        generatedAt: { type: string, format: date-time }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ContestRankProblem' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ContestRankRow' }
        selfOnly: { type: boolean, description: OI 赛时只返回本人行 }
    ContestMode:
      type: string
      enum: [icpc, ioi, oi]
    ContestRegisterType:
      type: string
      enum: [open, password, invite]
    ContestStatus:
      type: string
      enum: [upcoming, running, ended]
    ContestProblemInput:
      type: object
      required: [problemId, displayId, score]
      properties:
        problemId: { type: integer, format: int64 }
        displayId: { type: string, pattern: '^[A-Z]$' }
        score: { type: integer, minimum: 1, maximum: 1000 }
    ContestInput:
      type: object
      required: [title, descriptionMd, startTime, endTime, mode, isPublic, registerType, problems]
      properties:
        title: { type: string, maxLength: 100 }
        descriptionMd: { type: string, maxLength: 100000 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/ContestMode' }
        isRated: { type: boolean }
        isPublic: { type: boolean }
        registerType: { $ref: '#/components/schemas/ContestRegisterType' }
        password: { type: string, minLength: 4, maxLength: 64, description: 密码报名时必填；更新时留空表示保留原密码 }
        inviteCode: { type: string, minLength: 4, maxLength: 64, description: 邀请码报名时必填；更新时留空表示保留原邀请码 }
        problems: { type: array, maxItems: 26, items: { $ref: '#/components/schemas/ContestProblemInput' } }
    CloneContestRequest:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
    RegisterContestRequest:
      type: object
      properties:
        password: { type: string }
        inviteCode: { type: string }
    RegisterContestResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [registered]
              properties:
                registered: { type: boolean }
    ContestProblemItem:
      type: object
      required: [problemId, title, slug, displayId, sortOrder, score]
      properties:
        problemId: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        displayId: { type: string }
        sortOrder: { type: integer }
        score: { type: integer }
    ContestListItem:
      type: object
      required: [id, title, descriptionMd, startTime, endTime, mode, isRated, isPublic, registerType, status, problemCount, participantCount, registered, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        descriptionMd: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/ContestMode' }
        isRated: { type: boolean }
        isPublic: { type: boolean }
        registerType: { $ref: '#/components/schemas/ContestRegisterType' }
        status: { $ref: '#/components/schemas/ContestStatus' }
        problemCount: { type: integer, format: int64 }
        participantCount: { type: integer, format: int64 }
        registered: { type: boolean }
        createdAt: { type: string, format: date-time }
    ContestDetail:
      allOf:
        - $ref: '#/components/schemas/ContestListItem'
        - type: object
          required: [problems, registered, canManage, serverTime]
          properties:
            problems:
              type: array
              items: { $ref: '#/components/schemas/ContestProblemItem' }
            registered: { type: boolean }
            canManage: { type: boolean }
            serverTime: { type: string, format: date-time }
    ContestParticipant:
      type: object
      required: [userId, username, nickname, registerTime]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        registerTime: { type: string, format: date-time }
    Role:
      type: string
      enum: [user, problem_admin, contest_admin, super_admin]
    Status:
      type: string
      enum: [active, banned]
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_]{3,32}$' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72, description: 按字节计 }
        nickname: { type: string, maxLength: 32, description: 为空时默认等于用户名 }
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string, description: 用户名或邮箱 }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UpdateMeRequest:
      type: object
      properties:
        nickname: { type: string, maxLength: 32 }
        bio: { type: string, maxLength: 200 }
        avatarUrl: { type: string, maxLength: 512 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    Me:
      type: object
      required: [id, username, nickname, email, avatarUrl, role, rating, coins, bio, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        bio: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        createdAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, username, nickname, avatarUrl, bio, rating, coins, equippedBadges, equippedTitle, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        equippedBadges:
          type: array
          description: M3 上线前恒为空数组
          items: { type: object }
        equippedTitle:
          type: object
          nullable: true
          description: M3 上线前恒为 null
        createdAt: { type: string, format: date-time }
    Session:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/Me' }
    Envelope:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { nullable: true }
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { nullable: true }
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Session' }
    TokenPairResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/TokenPair' }
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Me' }
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Profile' }
    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [total, items]
              properties:
                total: { type: integer, format: int64 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Me' }
    ProblemType:
      type: string
      enum: [traditional, special, interactive]
    Sample:
      type: object
      required: [input, output]
      properties:
        input: { type: string }
        output: { type: string }
    ProblemInput:
      type: object
      required: [title, slug, statementMd, difficulty]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        solutionMd: { type: string, maxLength: 50000 }
        solutionCode: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 20 } }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        timeLimitMs: { type: integer, minimum: 100, maximum: 10000, description: 0 表示默认 1000 }
        memoryLimitMb: { type: integer, minimum: 16, maximum: 1024, description: 0 表示默认 256 }
        isPublic: { type: boolean, description: 创建时被忽略 }
        source: { type: string, maxLength: 200 }
    ProblemUpdateInput:
      type: object
      description: PUT 为整体替换，全部可编辑字段都必须提交；未提交的字段会被置为零值。
      required:
        - title
        - slug
        - statementMd
        - inputFormatMd
        - outputFormatMd
        - samples
        - hintMd
        - solutionMd
        - solutionCode
        - type
        - tags
        - difficulty
        - timeLimitMs
        - memoryLimitMb
        - isPublic
        - source
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        solutionMd: { type: string, maxLength: 50000 }
        solutionCode: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
