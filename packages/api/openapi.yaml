    LearningPathAuthor:
      type: object
      description: 学习路线作者的公开摘要。
      required: [id, username, nickname]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
    LearningPathItem:
      type: object
      description: 学习路线元信息，不含节点树；`myCompletedCount` 为服务端重算后的当前用户完成节点数（游客为 0）。
      required:
        - id
        - title
        - descriptionMd
        - coverUrl
        - isOfficial
        - isPublic
        - isActive
        - author
        - nodeCount
        - myCompletedCount
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        descriptionMd: { type: string }
        coverUrl: { type: string }
        isOfficial: { type: boolean, description: 官方路线；官方路线强制公开 }
        isPublic: { type: boolean, description: 公开自定义路线；私有路线仅作者与拥有 learning_path.admin.read 或 learning_path.official.manage 者可见 }
        isActive: { type: boolean, description: false 表示已下架（软删除），仅拥有 learning_path.admin.read 或 learning_path.official.manage 者可查看/恢复 }
        author: { $ref: '#/components/schemas/LearningPathAuthor' }
        nodeCount: { type: integer, description: 节点总数 }
        myCompletedCount: { type: integer, description: 服务端重算的当前用户已完成节点数；游客为 0 }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LearningPathInput:
      type: object
      description: >-
        创建/更新学习路线的可编辑字段。创建时未提交的 `isPublic` 默认 false、
        `isActive` 默认 true；更新时未提交的 `isPublic`/`isActive` 保持原值。
        `isOfficial` 仅创建时由拥有 learning_path.official.manage 者设置，创建后不可修改（更新提交不同值返回 40001）。
        普通用户不能创建/编辑官方路线，也不能改变上下架状态。
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100, description: trim 后 1–100 个字符 }
        descriptionMd: { type: string, maxLength: 50000 }
        coverUrl: { type: string, maxLength: 512, description: 仅 http/https 链接；空字符串表示无封面 }
        isOfficial: { type: boolean, description: 仅创建时拥有 learning_path.official.manage 者可设置；创建后不可修改；设为 true 时强制公开 }
        isPublic: { type: boolean, description: 公开后出现在路线列表，其他用户可查看树并按自己的进度挑战 }
        isActive: { type: boolean, description: 创建/更新时仅拥有 learning_path.official.manage 者可设置；false 为软删除，true 为恢复上架 }
        sortOrder: { type: integer }
    LearningNodeStatus:
      type: string
      description: 节点状态；`locked` 未解锁、`active` 进行中、`completed` 已完成（锁存，不回退）。
      enum: [locked, active, completed]
    LearningProblemSummary:
      type: object
      description: 节点树中暴露的公开题目摘要，不包含题干/题解。
      required: [problemId, title, slug, difficulty]
      properties:
        problemId: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        difficulty: { type: integer }
    LearningPathNodeItem:
      type: object
      description: 学习路线树中的一个节点；`children` 递归嵌套，按 `sortOrder`、`id` 排序。
      required:
        - id
        - parentId
        - title
        - descriptionMd
        - problemIds
        - problems
        - sortOrder
        - requiredCount
        - solvedCount
        - status
        - children
      properties:
        id: { type: integer, format: int64 }
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 父节点 id；根节点为 null
        title: { type: string }
        descriptionMd: { type: string }
        problemIds:
          type: array
          description: >-
            节点引用的题目 id，按节点配置顺序；公开树对非作者且无学习路线管理/只读权限者仅返回公开题目 id，
            作者、拥有 learning_path.admin.read 或 learning_path.official.manage 者返回完整存储列表（含已下线/缺失题目）
          items: { type: integer, format: int64 }
        problems:
          type: array
          description: 公开题目的摘要；题目下线后可能少于 problemIds
          items: { $ref: '#/components/schemas/LearningProblemSummary' }
        sortOrder: { type: integer }
        requiredCount: { type: integer, description: 完成本节点所需通过的题数 }
        solvedCount: { type: integer, description: 当前用户在该节点题目中去重 AC 的题数（服务端计算）；游客为 0；已完成节点保留完成时的值 }
        status: { $ref: '#/components/schemas/LearningNodeStatus' }
        children:
          type: array
          items: { $ref: '#/components/schemas/LearningPathNodeItem' }
    LearningNodeInput:
      type: object
      description: 创建/更新学习路线节点的可编辑字段；更新为整体替换。
      required: [title, problemIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 100, description: trim 后 1–100 个字符 }
        descriptionMd: { type: string, maxLength: 50000 }
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 父节点 id，必须属于同一路线且不能形成环；null 表示根节点
        problemIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: 1–50 道不重复、存在且公开的题目
          items: { type: integer, format: int64 }
        sortOrder: { type: integer }
        requiredCount: { type: integer, minimum: 1, description: 1–题目数；未提交时默认等于题目数 }
    LearningTree:
      type: object
      description: 学习路线树；`path` 为路线元信息，`nodes` 为根节点数组。
      required: [path, nodes]
      properties:
        path: { $ref: '#/components/schemas/LearningPathItem' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LearningPathNodeItem' }
    LearningPathListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [total, items]
              properties:
                total: { type: integer, format: int64 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/LearningPathItem' }
    LearningPathResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/LearningPathItem' }
    LearningNodeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
