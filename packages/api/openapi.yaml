        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/badges:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 用户拥有的徽章及装备状态（公开）
      description: 返回该用户拥有的全部徽章（包括已下线）与装备状态，按 sort_order、id 排序；用户不存在返回 40400。
      responses:
        '200':
          description: 用户徽章列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeListResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /titles:
    get:
      summary: 称号商店（游客可访问；登录用户含解锁、购买、装备状态与条件进度）
      description: |
        登录用户读取时先补算解锁（不扣金币）。已解锁但已下线的称号仍可见，未解锁且已下线的只对管理员可见。
        includeInactive=true 仅 super_admin 可用，否则返回 40300。列表按 sort_order、id 排序。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 仅 super_admin 可用；true 时包含全部已下线称号 }
      responses:
        '200':
          description: 称号列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建称号（仅超级管理员）
      description: '名称 1–100 字；颜色必须为 #RRGGBB；价格 0–1000000；解锁条件必须为正整数阈值、Rating 或符合成就 code 格式的字符串。'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '201':
          description: 创建成功；不含当前用户的解锁、购买与装备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /titles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新称号（仅超级管理员；整体替换）
      description: isActive 缺省时保持原值。删除为软下线，已解锁/已购买记录保留。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '200':
          description: 更新后的称号；不含当前用户的解锁、购买与装备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除称号（仅超级管理员；保留已解锁与已购买记录）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/purchase:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 购买称号（登录）
      description: 必须已解锁且未购买，并在同一事务内扣除金币、写流水、记录购买时间；未解锁、已购买或余额不足返回 40001。已下线但已解锁的称号仍可购买。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 购买成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/equip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 装备称号（登录）
      description: 必须已购买；同一事务内先卸下该用户全部称号再装备目标称号，重复装备幂等成功。未购买返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已装备或原本已装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /titles/{id}/unequip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 卸下称号（登录）
      description: 未装备时幂等成功；从未解锁该称号或称号不存在返回 40001。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已卸下或原本未装备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths:
    get:
      summary: 学习路线列表（游客可访问，可选登录）
      description: >-
        返回当前查看者可见的活跃路线：官方路线、公开自定义路线，以及自己创建的私有路线。
        私有路线仅作者与题目管理员/超级管理员可见；`mine=true` 只返回自己创建的路线。
        `includeInactive=true` 仅对管理员有效，用于查看已下架（软删除）路线；普通用户传入会被忽略。
        排序为官方优先，其次 `sortOrder`、`id`。M4-2A 尚未计算进度，`myCompletedCount` 只反映已存储的完成节点数，通常为 0。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: mine, in: query, schema: { type: boolean, default: false }, description: 仅返回当前登录用户创建的路线；游客返回空列表 }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 包含已下架路线；仅题目管理员/超级管理员有效 }
      responses:
        '200':
          description: 学习路线列表（不分页）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathListResponse' }
    post:
      summary: 创建学习路线（登录）
      description: >-
        普通用户创建自定义路线，默认私有（`isPublic=false`）、活跃，且不能设置官方标记；
        提交 `isOfficial=true` 返回 40300，非管理员提交的 `isActive` 会被忽略（始终为活跃）。
        题目管理员/超级管理员可以创建官方路线并设置 `isOfficial`/`isPublic`/`isActive`；
        官方路线强制公开（`isPublic=true`）。标题 1–100 字，描述不超过 50000 字，
        封面地址必须为 http/https 且不超过 512 字节。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningPathInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 学习路线详情（游客可访问，可选登录）
      description: >-
        活跃官方/公开路线所有人可见；活跃私有路线仅作者与管理员可见；已下架路线仅管理员可见。
        无权限或不存在均返回 40400。M4-2A 尚未计算进度，`myCompletedCount` 通常为 0。
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 学习路线元信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新学习路线（作者/管理员）
      description: >-
        只有作者或管理员可以编辑；官方路线仅题目管理员/超级管理员可编辑，已下架路线仅管理员可编辑/恢复。
        标题、描述、封面与 `sortOrder` 为整体替换（未提交的 `sortOrder` 变为 0）；
        `isPublic`/`isActive` 未提交时保持原值。`isOfficial` 仅可在创建时由管理员设置，创建后不可修改：
        管理员提交不同值返回 40001（不能把自定义路线提升为官方或取消官方标记），非管理员提交不同值返回 40300。
        官方路线强制公开。公开自定义路线或恢复上架前会校验节点引用的题目仍存在且公开，否则返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningPathInput' }
      responses:
        '200':
          description: 更新后的学习路线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 下架学习路线（作者/管理员）
      description: >-
        软删除（`isActive=false`），不删除节点、题目引用或用户进度。作者可下架自己的自定义路线，
        官方路线仅管理员可下架；已下架路线再次删除仅管理员可操作。作者删除后路线从其常规列表消失，
        只有管理员可通过 `includeInactive=true` 查看并恢复。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathDeleteResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/tree:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 学习路线树（游客可访问，可选登录）
      description: >-
        返回路线元信息、节点层级、节点题目摘要与当前用户进度。可见性与路线详情一致：
        私有路线仅作者/管理员可见，已下架路线仅管理员可见，否则返回 40400。
        节点只返回公开题目的 `problemId/title/slug/difficulty`，不返回题解。
        公开树对非作者/非管理员仅返回公开题目 id；作者与管理员保留完整存储列表
        （含已下线/缺失题目）用于编辑。当前为 M4-2A 临时状态：根节点 `active`、其余节点 `locked`、
        `solvedCount=0`；M4-2B 将替换为基于 AC 的服务端进度与完成锁存。
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 学习路线树
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningTreeResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/nodes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 创建学习路线节点（作者/管理员）
      description: >-
        只有路线作者或管理员可以写入；官方路线与已下架路线仅管理员可以写入。
        校验：标题 1–100 字、描述不超过 50000 字；`problemIds` 为 1–50 道不重复且存在、公开的题目；
        `requiredCount` 为 1–题目数，未提交时默认等于题目数；`parentId` 必须属于同一路线，
        不能是自身或形成环，节点树最大深度 8 层；`parentId` 未提交时为根节点。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningNodeInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningNodeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /learning-paths/{id}/nodes/{nodeId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: nodeId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新学习路线节点（作者/管理员）
      description: >-
        整体替换节点可编辑字段。权限与校验同创建节点；移动节点时同时校验父节点属于同一路线、
        不能是自身或形成环，且移动后的子树深度仍不超过 8 层。`requiredCount` 未提交时按本次
        `problemIds` 数量重置，而非保留原值。`nodeId` 必须属于该路线，否则返回 40400。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningNodeInput' }
      responses:
        '200':
          description: 更新后的节点（不含子节点）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningNodeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除学习路线节点（作者/管理员）
      description: >-
        仅允许删除叶子节点；存在子节点时返回 40001。删除节点会级联删除该节点的用户进度。
        官方路线与已下架路线仅管理员可以删除。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathDeleteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AnnouncementInput:
      type: object
      required: [title, contentMd]
      properties:
        title: { type: string, maxLength: 100 }
        contentMd: { type: string, maxLength: 50000 }
    AnnouncementItem:
      type: object
      required: [id, contestId, title, contentMd, createdAt]
      properties:
        id: { type: integer, format: int64 }
        contestId: { type: integer, format: int64 }
        title: { type: string }
        contentMd: { type: string }
        createdAt: { type: string, format: date-time }
    ContestRankProblem:
      type: object
      required: [problemId, displayId, title]
      properties:
        problemId: { type: integer, format: int64 }
        displayId: { type: string }
        title: { type: string }
    ContestRankCell:
      type: object
      required: [attempts, score]
      properties:
        status: { type: string, description: 该题最近一次未通过状态；有 AC 时为 accepted }
        attempts: { type: integer }
        acceptedAt: { type: string, format: date-time }
        score: { type: integer }
    ContestRankRow:
      type: object
      required: [rank, userId, username, nickname, equippedBadges, equippedTitle, solved, penalty, totalScore, problems]
      properties:
        rank: { type: integer }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        equippedBadges:
          type: array
          description: 已装备徽章，按 sort_order、id 排序；无装备时为空数组
          items: { $ref: '#/components/schemas/EquippedBadge' }
        equippedTitle:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EquippedTitle'
          description: 已装备称号；无装备时为 null
        solved: { type: integer }
        penalty: { type: integer, description: ICPC 罚时（分钟） }
        totalScore: { type: integer, description: IOI/OI 总分 }
        lastAcceptedAt: { type: string, format: date-time }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ContestRankCell' }
    ContestRanklist:
      type: object
      required: [contestId, mode, status, generatedAt, problems, rows, selfOnly]
      properties:
        contestId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/ContestMode' }
        status: { $ref: '#/components/schemas/ContestStatus' }
        generatedAt: { type: string, format: date-time }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ContestRankProblem' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ContestRankRow' }
        selfOnly: { type: boolean, description: OI 赛时只返回本人行 }
    ContestMode:
      type: string
      enum: [icpc, ioi, oi]
    ContestRegisterType:
      type: string
      enum: [open, password, invite]
    ContestStatus:
      type: string
      enum: [upcoming, running, ended]
    ContestProblemInput:
      type: object
      required: [problemId, displayId, score]
      properties:
        problemId: { type: integer, format: int64 }
        displayId: { type: string, pattern: '^[A-Z]$' }
        score: { type: integer, minimum: 1, maximum: 1000 }
    ContestInput:
      type: object
      required: [title, descriptionMd, startTime, endTime, mode, isPublic, registerType, problems]
      properties:
        title: { type: string, maxLength: 100 }
        descriptionMd: { type: string, maxLength: 100000 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/ContestMode' }
        isRated: { type: boolean }
        isPublic: { type: boolean }
        registerType: { $ref: '#/components/schemas/ContestRegisterType' }
        password: { type: string, minLength: 4, maxLength: 64, description: 密码报名时必填；更新时留空表示保留原密码 }
        inviteCode: { type: string, minLength: 4, maxLength: 64, description: 邀请码报名时必填；更新时留空表示保留原邀请码 }
        problems: { type: array, maxItems: 26, items: { $ref: '#/components/schemas/ContestProblemInput' } }
    CloneContestRequest:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
    RegisterContestRequest:
      type: object
      properties:
        password: { type: string }
        inviteCode: { type: string }
    RegisterContestResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [registered]
              properties:
                registered: { type: boolean }
    ContestProblemItem:
      type: object
      required: [problemId, title, slug, displayId, sortOrder, score]
      properties:
        problemId: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        displayId: { type: string }
        sortOrder: { type: integer }
        score: { type: integer }
    ContestListItem:
      type: object
      required: [id, title, descriptionMd, startTime, endTime, mode, isRated, isPublic, registerType, status, problemCount, participantCount, registered, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        descriptionMd: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/ContestMode' }
        isRated: { type: boolean }
        isPublic: { type: boolean }
        registerType: { $ref: '#/components/schemas/ContestRegisterType' }
        status: { $ref: '#/components/schemas/ContestStatus' }
        problemCount: { type: integer, format: int64 }
        participantCount: { type: integer, format: int64 }
        registered: { type: boolean }
        createdAt: { type: string, format: date-time }
    ContestDetail:
      allOf:
        - $ref: '#/components/schemas/ContestListItem'
        - type: object
          required: [problems, registered, canManage, serverTime]
          properties:
            problems:
              type: array
