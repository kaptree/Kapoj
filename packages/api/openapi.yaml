openapi: 3.0.3
info:
  title: kapOJ API
  version: 0.1.0
  description: |
    kapOJ 后端接口。所有响应都使用统一结构 `{ code, message, data }`，
    `code` 为 0 表示成功，否则为错误码（见 DEVELOPMENT.md 2.4 的错误码表）。
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: 注册并直接登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: 用用户名或邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: 用 refresh token 换取新的令牌（旧 refresh token 立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: 登出，吊销 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /users/me:
    get:
      summary: 当前用户信息
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新当前用户资料（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /users/{id}/profile:
    get:
      summary: 用户公开主页
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 公开资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/rating-history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 用户 Rating 历史（公开）
      description: 按时间倒序返回 kind=contest 的 Rating 变化；用户不存在返回 40400。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Rating 历史分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingHistoryPageResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /leaderboard/rating:
    get:
      summary: Rating 排行榜（公开）
      description: 只包含状态为 active 的用户，按 Rating 倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Rating 排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingLeaderboardPageResponse' }
  /leaderboard/activity:
    get:
      summary: 活跃度排行榜（公开）
      description: 只包含总活跃度 > 0 且状态为 active 的用户，按总分倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 活跃度排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityLeaderboardPageResponse' }
  /leaderboard/sharing:
    get:
      summary: 共享排行榜（公开）
      description: 只包含共享分 > 0 且状态为 active 的用户，按共享分倒序、用户 ID 升序；榜单行附带已装备徽章/称号。游客可访问。
      security: [{}, { bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 共享排行榜分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingLeaderboardPageResponse' }
  /activity/summary:
    get:
      summary: 我的活跃度摘要（登录）
      description: 返回今日是否已签到、今日活跃度与总活跃度；日期边界使用服务器本地时区。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 活跃度摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySummaryResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /activity/signin:
    post:
      summary: 每日签到（登录）
      description: 每个本地自然日首次签到奖励 5 活跃度与 5 金币；重复签到返回 awarded=false，不重复发放奖励。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 签到结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySignInResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/stats:
    get:
      summary: 管理仪表盘统计（admin.dashboard.view）
      description: 返回用户/题目/比赛/提交/角色聚合计数；recentAudit 字段始终存在，仅 super 或拥有 admin.audit.view 时包含最近 10 条审计，否则为空数组。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 仪表盘统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatsResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/audit:
    get:
      summary: 审计日志分页（admin.audit.view）
      description: 支持 actorId/action/targetType/from/to 过滤，按 created_at 倒序返回。
      security: [{ bearer: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: RFC3339 或 YYYY-MM-DD（闭区间） }
        - { name: to, in: query, schema: { type: string }, description: RFC3339 或 YYYY-MM-DD（闭区间；日期形式覆盖整天） }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 审计分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/permissions:
    get:
      summary: 权限目录（role.read）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 权限目录（按分组与排序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPermissionListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles:
    get:
      summary: 角色列表（role.read）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 角色列表（含权限与用户数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建自定义角色（role.create）
      description: code 需符合 `^[a-z][a-z0-9_]{2,63}$`，创建后不可修改；permissionCodes 必须全部存在（重复自动去重）。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRoleInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 更新角色名称/描述（role.update）
      description: 系统角色 code/name 不可改（40001）；自定义角色 code 创建后不可修改（code 传值须与当前一致，否则 40001）。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRoleUpdateInput' }
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除自定义角色（role.delete）
      description: 系统角色不可删除（40001）；删除时清理角色权限与用户关联，并在同一事务写审计。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/roles/{id}/permissions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 整体替换角色权限（role.permissions.update）
      description: super_admin 权限不可修改（40001）；permissionCodes 为完整权限集合，空数组表示移除全部权限。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRolePermissionsInput' }
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      summary: 用户列表（user.read）
      description: 支持 keyword/status/roleId 过滤与分页；封禁用户同样出现在列表与详情中。
      security: [{ bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配用户名/昵称/邮箱，不区分大小写，按字面量匹配 }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: roleId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: 用户详情（user.read）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 用户详情（含角色与 isSuperAdmin）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 编辑用户资料（user.update）
      description: 只更新提供的字段（nickname/bio/avatarUrl），并在同一事务写审计。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdateInput' }
      responses:
        '200':
          description: 更新后的用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/roles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      summary: 整体替换用户角色（user.roles.assign）
      description: roleIds 为完整角色集合，空数组移除全部角色；只有 super 能授予/移除 super_admin；不能移除最后一个活跃 super。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserRolesInput' }
      responses:
        '200':
          description: 更新后的用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/ban:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 封禁用户（user.ban）
      description: 禁止封禁自己（40001）；只有 super 能封禁 super；禁止封禁最后一个活跃 super（40001）。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserBanInput' }
      responses:
        '200':
          description: 已封禁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/unban:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      summary: 解封用户（user.ban）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已解封
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests:
    get:
      summary: 比赛列表（公开；contest.view_hidden 可 includeHidden）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/ContestMode' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContestStatus' } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 需要 contest.view_hidden 权限；需携带 bearer token }
        - { name: mine, in: query, schema: { type: boolean }, description: 仅返回当前登录用户已报名的比赛；游客使用返回 40001 }
        - { name: problemId, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: 仅返回包含该题的比赛；带此参数时使用“公开 OR 本人已报名 OR contest.view_hidden”联合可见性；非法值返回 40001 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 比赛分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建比赛（contest.create）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /contests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 比赛详情；非公开比赛对非报名者且无 contest.view_hidden 者返回 40400
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 比赛详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换比赛（contest.update）；problems 为完整题目列表
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestInput' }
      responses:
        '200':
          description: 更新后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除比赛（contest.delete）；级联删除题目关联、报名与公告
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/clone:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 克隆比赛（contest.create）；复制配置与题目，不复制报名/公告
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneContestRequest' }
      responses:
        '201':
          description: 克隆后的比赛
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /contests/{id}/register:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
