  /problems:
    get:
      summary: 题目列表（游客可访问，只返回已公开题目）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配标题或题目标识，不区分大小写，按字面量匹配 }
        - { name: tag, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 需要 problem.view_hidden 权限；需携带 bearer token }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
