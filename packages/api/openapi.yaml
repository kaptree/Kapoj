          properties:
            isSuperAdmin: { type: boolean, description: 是否为超级管理员 }
    AdminUserPage:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUserItem' }
    AdminUserUpdateInput:
      type: object
      description: 只更新提供的字段；字段省略或为 null 表示不修改。
      properties:
        nickname: { type: string, minLength: 1, maxLength: 32 }
        bio: { type: string, maxLength: 200 }
        avatarUrl: { type: string, maxLength: 512 }
    AdminUserRolesInput:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          description: 完整角色 id 集合，空数组移除全部角色
          items: { type: integer, format: int64 }
    AdminUserBanInput:
