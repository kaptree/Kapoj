        unlockedAt: { type: string, format: date-time, nullable: true, description: 未解锁时为 null }
        purchased: { type: boolean }
        purchasedAt: { type: string, format: date-time, nullable: true, description: 未购买时为 null }
        equipped: { type: boolean }
