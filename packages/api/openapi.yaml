    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 支付金币解锁官方题解（登录）
      description: >-
        价格 0、已通过、创建者/super 或已解锁时不扣费并返回当前视图；价格 >0 且未解锁时在事务内
        写入解锁记录并扣金币。重复请求幂等，不重复扣费；金币不足返回 40001。解锁永久有效，改价不影响已解锁用户。
        隐藏题无 problem.view_hidden/super 时返回 40400。
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 购买/解锁后的官方题解访问视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialSolutionViewResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
