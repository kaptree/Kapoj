          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AdminPermissionItem' }
    AdminRoleListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AdminRoleItem' }
    AdminRoleResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AdminRoleItem' }
    AdminUserPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AdminUserPage' }
    AdminUserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AdminUserDetail' }
    AdminAuditPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AdminAuditPage' }
    AdminStatsResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AdminStats' }
    ProblemType:
      type: string
      enum: [traditional, special, interactive]
    Sample:
      type: object
      required: [input, output]
      properties:
        input: { type: string }
        output: { type: string }
    ProblemInput:
      type: object
      required: [title, slug, statementMd, difficulty]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 20 } }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        timeLimitMs: { type: integer, minimum: 100, maximum: 10000, description: 0 表示默认 1000 }
        memoryLimitMb: { type: integer, minimum: 16, maximum: 1024, description: 0 表示默认 256 }
        isPublic: { type: boolean, description: 创建时被忽略；新题一律未公开 }
        source: { type: string, maxLength: 200 }
    ProblemUpdateInput:
      type: object
      description: PUT 为整体替换，全部可编辑字段都必须提交；未提交的字段会被置为零值。
      required:
        - title
        - slug
        - statementMd
        - inputFormatMd
        - outputFormatMd
        - samples
        - hintMd
        - type
        - tags
        - difficulty
        - timeLimitMs
        - memoryLimitMb
        - isPublic
        - source
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 20 } }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        timeLimitMs: { type: integer, minimum: 100, maximum: 10000, description: 0 表示默认 1000 }
        memoryLimitMb: { type: integer, minimum: 16, maximum: 1024, description: 0 表示默认 256 }
        isPublic: { type: boolean, description: 整体替换；修改此字段（公开/下线）需要 problem.update + problem.publish，false 会下线题目 }
        source: { type: string, maxLength: 200 }
    ProblemListItem:
      type: object
      required: [id, title, slug, type, tags, difficulty, timeLimitMs, memoryLimitMb, submitCount, acceptCount, isPublic, source, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, items: { type: string } }
        difficulty: { type: integer }
        timeLimitMs: { type: integer }
        memoryLimitMb: { type: integer }
        submitCount: { type: integer }
        acceptCount: { type: integer }
        isPublic: { type: boolean }
        source: { type: string }
        createdAt: { type: string, format: date-time }
    ProblemDetail:
      allOf:
        - $ref: '#/components/schemas/ProblemListItem'
        - type: object
          required: [statementMd, inputFormatMd, outputFormatMd, samples, hintMd, solutionPriceCoins]
          properties:
            statementMd: { type: string }
            inputFormatMd: { type: string }
            outputFormatMd: { type: string }
            samples: { type: array, items: { $ref: '#/components/schemas/Sample' } }
            hintMd: { type: string }
            solutionPriceCoins: { type: integer, format: int64, description: 官方题解解锁价格（金币），0 表示所有人免费；对所有可读题目始终返回，不受题解访问状态影响 }
            solutionMd: { type: string, description: 拥有题目管理权限（problem.update/delete/publish/testcase.manage/checker.manage）或本人已通过该题时可见 }
            solutionCode: { type: string, description: 拥有题目管理权限或本人已通过该题时可见 }
            checkerUploaded: { type: boolean, description: 拥有题目管理权限或本人已通过该题时可见 }
            createdBy: { type: integer, format: int64, description: 拥有题目管理权限或本人已通过该题时可见 }
    Testcase:
      type: object
      required: [id, sortOrder, score, isSample, inputSize, outputSize]
      properties:
        id: { type: integer, format: int64 }
        sortOrder: { type: integer }
        score: { type: integer }
        isSample: { type: boolean }
        inputSize: { type: integer, format: int64 }
        outputSize: { type: integer, format: int64 }
    UpdateTestcaseRequest:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 1000 }
        isSample: { type: boolean }
    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: integer, format: int64 } }
    SubmissionLanguage:
      type: string
      enum: [c, cpp, python3, java, go]
    SubmissionStatus:
      type: string
      enum:
        - pending
        - judging
        - accepted
        - wrong_answer
        - time_limit_exceeded
        - memory_limit_exceeded
