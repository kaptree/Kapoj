        nickname: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        equippedBadges:
          type: array
          description: 已装备徽章，按 sort_order、id 排序；无装备时为空数组
