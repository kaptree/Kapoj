    EquippedTitle:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    PublicIdentity:
      type: object
      description: 公开身份结构；Profile、SubmissionListItem、ContestRankRow 的装备字段使用同一形状。
      required: [equippedBadges, equippedTitle]
      properties:
        equippedBadges:
          type: array
          description: 已装备徽章，按 sort_order、id 排序；无装备时为空数组
          items: { $ref: '#/components/schemas/EquippedBadge' }
        equippedTitle:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EquippedTitle'
          description: 已装备称号；无装备时为 null
    AchievementConditionType:
      type: string
      description: 成就条件类型；all_of 组合 2–8 个非 all_of 的子条件，不允许嵌套。
      enum: [ac_count, contest_count, login_streak, created_contest, all_of]
    AchievementCondition:
      type: object
      required: [type, threshold]
      description: all_of 中的子条件；type 不能为 all_of。
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AchievementConditionType'
          description: 不能为 all_of，避免嵌套。
        threshold: { type: integer, format: int64, minimum: 1 }
    AchievementConditionConfig:
      type: object
      description: 单条件提交 threshold；all_of 提交 conditions。响应只返回实际使用的一种字段。
      properties:
        threshold: { type: integer, format: int64, minimum: 1, description: 单条件阈值，必须为正整数 }
        conditions:
          type: array
          minItems: 2
          maxItems: 8
          description: all_of 的子条件列表
          items: { $ref: '#/components/schemas/AchievementCondition' }
    AchievementConditionProgress:
      type: object
      required: [type, current, target, done]
      properties:
        type: { $ref: '#/components/schemas/AchievementConditionType' }
        current: { type: integer, format: int64, description: 当前值；all_of 会拆成逐项进度 }
        target: { type: integer, format: int64 }
        done: { type: boolean }
    AchievementItem:
      type: object
