        imageUrl 为空字符串时保持现有图片（上传接口单独写入）。删除为软下线，已购买用户仍保留并展示。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BadgeInput' }
      responses:
        '200':
          description: 更新后的徽章；不含当前用户的拥有状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
