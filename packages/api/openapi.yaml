      summary: 上传徽章图片（仅超级管理员；multipart）
      description: |
        file 字段支持 PNG、JPEG、WebP、GIF，且不超过 2 MiB；保存为 badges/<id>，
        并把 image_url 写为 /api/badges/<id>/image。缺少文件、格式或大小非法返回 40001。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
