openapi: 3.0.3
info:
  title: kapOJ API
  version: 0.1.0
  description: |
    kapOJ 后端接口。所有响应都使用统一结构 `{ code, message, data }`，
    `code` 为 0 表示成功，否则为错误码（见 DEVELOPMENT.md 2.4 的错误码表）。
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: 注册并直接登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: 用用户名或邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: 用 refresh token 换取新的令牌（旧 refresh token 立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: 登出，吊销 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /users/me:
    get:
      summary: 当前用户信息
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新当前用户资料（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /users/{id}/profile:
    get:
      summary: 用户公开主页
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 公开资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      summary: 用户列表（仅超级管理员）
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /problems:
    get:
      summary: 题目列表（游客可访问，只返回已公开题目）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配标题或题目标识，不区分大小写，按字面量匹配 }
        - { name: tag, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: includeHidden, in: query, schema: { type: boolean }, description: 仅题目管理员有效；需要携带 bearer token }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 题目分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 创建题目（题目管理员）；新题目一律为未公开
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 题目详情；未公开题目对非管理员返回 40400
      responses:
        '200':
          description: 题目详情；题解字段对管理员或本人已通过该题的用户可见
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 整体替换题目（题目管理员）；必须提交全部可编辑字段
      description: >-
        PUT 是整体替换：未提交的字段会变成零值（字符串清空、数组清空、isPublic=false），
        不会保留原值。发布需至少 1 个测试点，特判题还需 checker。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemUpdateInput' }
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetailResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除题目；已有提交记录时只下线
      security: [{ bearer: [] }]
      responses:
        '200':
          description: offlined 为 true 表示仅下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteProblemResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/statistics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 提交统计
      responses:
        '200':
          description: 提交与通过统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测试点列表（题目管理员）
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 按顺序排列的测试点元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 上传测试点（题目管理员）；输入输出文件各不超过 16 MiB，请求体不超过 40 MiB
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, output]
              properties:
                input: { type: string, format: binary }
                output: { type: string, format: binary }
                score: { type: integer, minimum: 0, maximum: 1000, default: 10 }
                isSample: { type: boolean, default: false }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestcaseResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases/{tid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: tid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 修改测试点分数或样例标记（只更新提供的字段）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestcaseRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除测试点；公开题目不能删除最后一个测试点
      security: [{ bearer: [] }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/testcases/reorder:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 调整测试点顺序；ids 必须恰好是该题全部测试点
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRequest' }
      responses:
        '200':
          description: 已调整
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /problems/{id}/checker:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 上传特判 checker（C++ 源码，不超过 256 KiB，仅特判题）
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /submissions:
    get:
      summary: 测评记录列表（游客可访问）
      security: [{}, { bearer: [] }]
      parameters:
        - { name: problemId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: contestId, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: 0 表示练习提交 }
        - { name: userId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: language, in: query, schema: { $ref: '#/components/schemas/SubmissionLanguage' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubmissionStatus' } }
        - { name: nickname, in: query, schema: { type: string, maxLength: 64 }, description: 昵称模糊匹配 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 测评记录分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionPageResponse' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 提交代码（登录用户）；创建后进入 pending 并由评测服务异步处理
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubmissionRequest' }
      responses:
        '201':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionCreatedResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /submissions/stream:
    get:
      summary: 测评记录实时事件（SSE）；事件数据只含 submissionId
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 'text/event-stream；每行 data 为 {"submissionId": <id>}'
          content:
            text/event-stream:
              schema: { type: string }
        '503': { $ref: '#/components/responses/Error' }
  /submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 测评记录详情；比赛提交对他人的代码与测评详情暂不可见
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 测评记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Role:
      type: string
      enum: [user, problem_admin, contest_admin, super_admin]
    Status:
      type: string
      enum: [active, banned]
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_]{3,32}$' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72, description: 按字节计 }
        nickname: { type: string, maxLength: 32, description: 为空时默认等于用户名 }
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string, description: 用户名或邮箱 }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UpdateMeRequest:
      type: object
      properties:
        nickname: { type: string, maxLength: 32 }
        bio: { type: string, maxLength: 200 }
        avatarUrl: { type: string, maxLength: 512 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    Me:
      type: object
      required: [id, username, nickname, email, avatarUrl, role, rating, coins, bio, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        bio: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        createdAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, username, nickname, avatarUrl, bio, rating, coins, equippedBadges, equippedTitle, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        equippedBadges:
          type: array
          description: M3 上线前恒为空数组
          items: { type: object }
        equippedTitle:
          type: object
          nullable: true
          description: M3 上线前恒为 null
        createdAt: { type: string, format: date-time }
    Session:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/Me' }
    Envelope:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { nullable: true }
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { nullable: true }
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Session' }
    TokenPairResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/TokenPair' }
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Me' }
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Profile' }
    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [total, items]
              properties:
                total: { type: integer, format: int64 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Me' }
    ProblemType:
      type: string
      enum: [traditional, special, interactive]
    Sample:
      type: object
      required: [input, output]
      properties:
        input: { type: string }
        output: { type: string }
    ProblemInput:
      type: object
      required: [title, slug, statementMd, difficulty]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        solutionMd: { type: string, maxLength: 50000 }
        solutionCode: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 20 } }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        timeLimitMs: { type: integer, minimum: 100, maximum: 10000, description: 0 表示默认 1000 }
        memoryLimitMb: { type: integer, minimum: 16, maximum: 1024, description: 0 表示默认 256 }
        isPublic: { type: boolean, description: 创建时被忽略 }
        source: { type: string, maxLength: 200 }
    ProblemUpdateInput:
      type: object
      description: PUT 为整体替换，全部可编辑字段都必须提交；未提交的字段会被置为零值。
      required:
        - title
        - slug
        - statementMd
        - inputFormatMd
        - outputFormatMd
        - samples
        - hintMd
        - solutionMd
        - solutionCode
        - type
        - tags
        - difficulty
        - timeLimitMs
        - memoryLimitMb
        - isPublic
        - source
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: 会先 trim 并转小写 }
        statementMd: { type: string, maxLength: 100000 }
        inputFormatMd: { type: string, maxLength: 20000 }
        outputFormatMd: { type: string, maxLength: 20000 }
        samples: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sample' } }
        hintMd: { type: string, maxLength: 50000 }
        solutionMd: { type: string, maxLength: 50000 }
        solutionCode: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 20 } }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        timeLimitMs: { type: integer, minimum: 100, maximum: 10000, description: 0 表示默认 1000 }
        memoryLimitMb: { type: integer, minimum: 16, maximum: 1024, description: 0 表示默认 256 }
        isPublic: { type: boolean, description: 整体替换；false 会下线题目 }
        source: { type: string, maxLength: 200 }
    ProblemListItem:
      type: object
      required: [id, title, slug, type, tags, difficulty, timeLimitMs, memoryLimitMb, submitCount, acceptCount, isPublic, source, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/ProblemType' }
        tags: { type: array, items: { type: string } }
        difficulty: { type: integer }
        timeLimitMs: { type: integer }
        memoryLimitMb: { type: integer }
        submitCount: { type: integer }
        acceptCount: { type: integer }
        isPublic: { type: boolean }
        source: { type: string }
        createdAt: { type: string, format: date-time }
    ProblemDetail:
      allOf:
        - $ref: '#/components/schemas/ProblemListItem'
        - type: object
          required: [statementMd, inputFormatMd, outputFormatMd, samples, hintMd]
          properties:
            statementMd: { type: string }
            inputFormatMd: { type: string }
            outputFormatMd: { type: string }
            samples: { type: array, items: { $ref: '#/components/schemas/Sample' } }
            hintMd: { type: string }
            solutionMd: { type: string, description: 管理员或本人已通过该题时可见 }
            solutionCode: { type: string, description: 管理员或本人已通过该题时可见 }
            checkerUploaded: { type: boolean, description: 管理员或本人已通过该题时可见 }
            createdBy: { type: integer, format: int64, description: 管理员或本人已通过该题时可见 }
    Testcase:
      type: object
      required: [id, sortOrder, score, isSample, inputSize, outputSize]
      properties:
        id: { type: integer, format: int64 }
        sortOrder: { type: integer }
        score: { type: integer }
        isSample: { type: boolean }
        inputSize: { type: integer, format: int64 }
        outputSize: { type: integer, format: int64 }
    UpdateTestcaseRequest:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 1000 }
        isSample: { type: boolean }
    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: integer, format: int64 } }
    SubmissionLanguage:
      type: string
      enum: [c, cpp, python3, java, go]
    SubmissionStatus:
      type: string
      enum:
        - pending
        - judging
        - accepted
        - wrong_answer
        - time_limit_exceeded
        - memory_limit_exceeded
        - runtime_error
        - compile_error
        - system_error
    CreateSubmissionRequest:
      type: object
      required: [problemId, language, code]
      properties:
        problemId: { type: integer, format: int64, minimum: 1 }
        language: { $ref: '#/components/schemas/SubmissionLanguage' }
        code: { type: string, minLength: 1, maxLength: 65536, description: 按 UTF-8 字节数不超过 64 KiB }
    SubmissionCreated:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
    SubmissionJudgeCase:
      type: object
      required: [testcaseId, status, timeMs, memoryKb]
      properties:
        testcaseId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        timeMs: { type: integer }
        memoryKb: { type: integer }
        message: { type: string }
    SubmissionListItem:
      type: object
      required:
        - id
        - userId
        - username
        - nickname
        - problemId
        - problemTitle
        - problemSlug
        - language
        - status
        - timeUsedMs
        - memoryUsedKb
        - score
        - createdAt
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        problemId: { type: integer, format: int64 }
        problemTitle: { type: string }
        problemSlug: { type: string }
        contestId: { type: integer, format: int64 }
        language: { $ref: '#/components/schemas/SubmissionLanguage' }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        timeUsedMs: { type: integer }
        memoryUsedKb: { type: integer }
        score: { type: integer }
        createdAt: { type: string, format: date-time }
        judgedAt: { type: string, format: date-time }
    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/SubmissionListItem'
        - type: object
          required: [codeHidden, judgeResult]
          properties:
            code: { type: string, description: 比赛进行中对他人的提交不返回 }
            codeHidden: { type: boolean }
            errorMessage: { type: string }
            judgeResult:
              type: array
              items: { $ref: '#/components/schemas/SubmissionJudgeCase' }
    Stats:
      type: object
      required: [submitCount, acceptCount, acceptRate]
      properties:
        submitCount: { type: integer }
        acceptCount: { type: integer }
        acceptRate: { type: number, description: 0 到 1，没有提交时为 0 }
    ProblemPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [total, items]
              properties:
                total: { type: integer, format: int64 }
                items: { type: array, items: { $ref: '#/components/schemas/ProblemListItem' } }
    ProblemDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/ProblemDetail' }
    DeleteProblemResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [offlined]
              properties:
                offlined: { type: boolean }
    StatsResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Stats' }
    TestcaseResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Testcase' }
    TestcaseListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Testcase' } }
    SubmissionCreatedResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/SubmissionCreated' }
    SubmissionPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [total, items]
              properties:
                total: { type: integer, format: int64 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SubmissionListItem' }
    SubmissionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/SubmissionDetail' }
