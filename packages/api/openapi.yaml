        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        action: { type: string, description: 权限码或内部动作码 }
        targetType: { type: string }
        targetId: { type: integer, format: int64, nullable: true }
        summary: { type: string, description: 中文摘要，不含密码/token/代码等敏感信息 }
        ip: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
    AdminAuditPage:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditItem' }
    AdminStats:
      type: object
      required: [users, activeUsers, bannedUsers, problems, publicProblems, contests, submissions, todaySubmissions, roles, recentAudit]
      properties:
        users: { type: integer, format: int64, description: 用户总数（含封禁） }
        activeUsers: { type: integer, format: int64 }
        bannedUsers: { type: integer, format: int64 }
        problems: { type: integer, format: int64 }
        publicProblems: { type: integer, format: int64 }
        contests: { type: integer, format: int64 }
        submissions: { type: integer, format: int64 }
        todaySubmissions: { type: integer, format: int64, description: 服务器本地日历日内的提交数 }
        roles: { type: integer, format: int64 }
        recentAudit:
          type: array
          description: 字段始终存在；仅 super 或拥有 admin.audit.view 时包含最近 10 条（按时间倒序），否则为空数组
          items: { $ref: '#/components/schemas/AdminAuditItem' }
    AdminPermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
