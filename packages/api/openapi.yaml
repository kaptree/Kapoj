    get:
      summary: 官方题解访问视图（可选登录）
      description: >-
        返回解锁价格、访问状态（free|accepted|purchased|creator|locked|guest）以及可编辑/可购买标记；
        仅当访问状态允许时返回 solutionMd/solutionCode，locked/guest 不返回正文。
        隐藏题要求 problem.view_hidden 或 super，否则与不存在一致返回 40400，不沿用比赛参与者 fallback。
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: 官方题解访问视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialSolutionViewResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: 保存官方题解（登录；题目创建者或超级管理员）
      description: >-
        唯一写入口，不修改题面/测试数据。仅题目创建者（problem.created_by）或 super 可编辑，否则返回 40300。
        说明不超过 50000 字符、代码不超过 65536 字节、价格 0–1000000 金币（0 表示免费）。
        隐藏题无 problem.view_hidden/super 时返回 40400。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfficialSolutionInput' }
      responses:
        '200':
          description: 更新后的官方题解访问视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialSolutionViewResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
