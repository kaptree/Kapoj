        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminRoleInput:
      type: object
      required: [code, name, permissionCodes]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$', description: 创建后不可修改 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          description: 权限码集合，必须全部存在；重复自动去重
          items: { type: string }
    AdminRoleUpdateInput:
      type: object
      required: [name]
      properties:
        code: { type: string, description: 可选；传值时必须与当前 code 一致，否则 40001；角色 code 创建后不可修改 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    AdminRolePermissionsInput:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes:
          type: array
          description: 完整权限码集合，空数组移除全部权限；必须全部存在，重复去重
          items: { type: string }
    AdminUserItem:
      type: object
      required: [id, username, nickname, email, role, rating, coins, status, roles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        rating: { type: integer }
        coins: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/Status' }
        roles:
          type: array
          description: 实际管理角色集合（RBAC）；无角色时为空数组
          items: { $ref: '#/components/schemas/RoleSummary' }
        createdAt: { type: string, format: date-time }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserItem'
